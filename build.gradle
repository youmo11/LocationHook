// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// 高德地图Key配置（可以通过local.properties覆盖）
ext {
    amap_api_key = "请输入你的高德地图API Key"
    // 或者从local.properties读取
    Properties properties = new Properties()
    if (file('local.properties').exists()) {
        properties.load(new FileInputStream(file('local.properties')))
        if (properties.containsKey('AMAP_API_KEY')) {
            amap_api_key = properties.getProperty('AMAP_API_KEY')
        }
    }
}
